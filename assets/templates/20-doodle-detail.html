<!-- ============================================================================
     20-doodle-detail.html — 涂鸦详情页主体（贴进 00-shell.html 的 .main-page 里）
     ----------------------------------------------------------------------------
     结构（自上而下）：
       section-1   hero-doodle    图片区 + 标题条
       section-2   （无类名）       正文引言
       section-3   key-themes     关键主题 chips + 随机主题入口
       section-11  cards-stack    Discover more Doodles 卡片网格

     关键点：
       · 每个 section 都带 doodle-module + theme-<color>
       · theme-<color> 取涂鸦图片的主色（20 选 1，见 references/design-tokens.md）
       · 图片区 / 标题条用 .display-flex 包三个柱子：
           左 background-padding（纯色延伸） + 中 glue-page.no-margin（内容） +
           右 background-padding（同色延伸）——
         这样内容被夹在 1296px 中间，两侧颜色铺满视口，正是原站的做法。
     ============================================================================ -->

<div class="main-page">

  <!-- ======================================== 1. 图片 + 标题（hero-doodle） -->
  <div class="hero-doodle doodle-module theme-pink" id="section-1">

    <!-- 1a. 图片区：下描边分隔 -->
    <div class="display-flex border-bottom">
      <div class="background-padding"></div>
      <div class="glue-page no-margin">
        <section class="img-container">
          <div class="media-container">
            <img loading="lazy" src="/img/100th-anniversary-of-flight.jpg"
                 class="doodle-image" alt="100th Anniversary of Flight">
          </div>
        </section>
      </div>
      <div class="background-padding"></div>
    </div>

    <!-- 1b. 标题条：背景走 surface-<n> 阶梯色 -->
    <div class="display-flex">
      <div class="background-padding surface-1"></div>
      <div class="glue-page no-margin">
        <section class="content-container surface-1">
          <h1 class="title">100th Anniversary of Flight</h1>
        </section>
      </div>
      <div class="background-padding surface-1"></div>
    </div>

  </div>


  <!-- ============================================ 2. 正文引言 openers ===== -->
  <div class="doodle-module theme-pink" id="section-2">
    <div class="glue-page">
      <div class="opener neutral-surface-1 main-outline add_link_class">
        <p>Learn more about the creation of 100th Anniversary of Flight Doodle
           and discover the story behind the unique artwork.</p>
      </div>
    </div>
  </div>

  <!-- 正文里的富内容区块（原站会在这里插图片/视频/互动模块），
       每个继续沿用同一 theme-<color>：
  <div class="doodle-module theme-pink" id="section-4">
    <div class="glue-page">
      <figure class="doodle-figure">
        <img loading="lazy" src="/img/…" alt="…">
        <figcaption class="glue-caption">…</figcaption>
      </figure>
    </div>
  </div>
  -->


  <!-- ============================================ 3. 关键主题 key-themes = -->
  <div class="doodle-module theme-pink key-themes" id="section-3">
    <div class="glue-page">

      <h2 class="key-themes-title">This Doodle's Key Themes</h2>

      <div class="themes-cta-wrapper">

        <div class="themes-wrapper">
          <a aria-label="Other" class="theme surface-4-outline"
             href="/search/?topic_tags=Other"
             data-g-event="module_key_themes" data-g-module_name="key_themes"
             data-g-cta_type="module" data-g-cta_text="Other">Other</a>
        </div>

        <!-- "Explore a Random Theme"：data-links 是待跳转的主题池（JSON 数组，
             属性值里的引号要写成 &#34;） -->
        <a aria-label="Explore a Random Theme" class="key-themes-cta-link"
           href="/search/?topic_tags=Aviation"
           data-links='["/search/?topic_tags=Aviation","/search/?topic_tags/Music","/search/?topic_tags/Engineering","/search/?topic_tags/Nowruz"]'>
          <div class="key-themes-cta-wrapper">
            <div class="key-themes-cta">Explore a Random Theme</div>
            <svg width="21" height="16" viewBox="0 0 21 16" fill="none"
                 alt="" role="img" aria-hidden="true">
              <use href="/static/icons.svg#right-arrow-doodles"></use>
            </svg>
          </div>
        </a>

      </div>
    </div>
  </div>


  <!-- ======================================== 11. 相关涂鸦推荐卡片 ======= -->
  <div class="doodle-module theme-pink cards-stack" id="section-11">
    <div class="glue-page">

      <h2 class="cards-stack-title">Discover more Doodles</h2>

      <div class="cards-stack-grid">

        <!-- 详情页的卡片是极简版：<img class="doodle-card-img"> 直接贴在 img 上，
             外加一个 .doodle-card-title。注意与首页的 .doodle-card 结构不同。 -->
        <div class="doodle-card-wrapper">
          <a href="/doodle/portugal-national-day-2018/" class="doodle-card-link">
            <img loading="lazy" class="doodle-card-img"
                 src="/img/portugal-national-day-2018.gif"
                 alt="Portugal National Day 2018">
            <div class="doodle-card-title">Portugal National Day 2018</div>
          </a>
        </div>

        <div class="doodle-card-wrapper">
          <a href="/doodle/celebrating-semla/" class="doodle-card-link">
            <img loading="lazy" class="doodle-card-img"
                 src="/img/celebrating-semla.gif"
                 alt="Celebrating Semla">
            <div class="doodle-card-title">Celebrating Semla</div>
          </a>
        </div>

        <!-- 共 8 张，栅格自动折行 -->

      </div>
    </div>
  </div>

</div>
